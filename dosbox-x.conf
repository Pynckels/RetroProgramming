[cpu]
cputype                = auto
cycles                 = max

[dosbox]
shell environment size = 16384
splash                 = false
startbanner            = false
time source            = local

[midi]
mididevice             = none

[mixer]
nosound                = true

[parallel]
parallel1              = file file:~/retroprogramming/lpt/lpt1/dosbox-x.lpt1.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel2              = file file:~/retroprogramming/lpt/lpt2/dosbox-x.lpt2.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel3              = file file:~/retroprogramming/lpt/lpt3/dosbox-x.lpt3.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel4              = file file:~/retroprogramming/lpt/lpt4/dosbox-x.lpt4.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel5              = file file:~/retroprogramming/lpt/lpt5/dosbox-x.lpt5.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel6              = file file:~/retroprogramming/lpt/lpt6/dosbox-x.lpt6.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel7              = file file:~/retroprogramming/lpt/lpt7/dosbox-x.lpt7.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel8              = file file:~/retroprogramming/lpt/lpt8/dosbox-x.lpt8.bin timeout:500 openwith:~/retroprogramming/doslpt.sh
parallel9              = file file:~/retroprogramming/lpt/lpt9/dosbox-x.lpt9.bin timeout:500 openwith:~/retroprogramming/doslpt.sh

[render]
aspect                 = true
scaler                 = none

[sdl]
enabledosboxkeys       = false
output                 = opengl
windowresolution       = 1080x810

[serial]
serial1                = nullmodem server port:5001
serial2                = nullmodem server port:5002
serial3                = nullmodem server port:5003
serial4                = nullmodem server port:5004
serial5                = nullmodem server port:5005
serial6                = nullmodem server port:5006
serial7                = nullmodem server port:5007
serial8                = nullmodem server port:5008
serial9                = nullmodem server port:5009

[config]
break                  = off
country                = 32
dos                    = high, umb
fcbs                   = 0
files                  = 0
lastdrive              = z
device driver mcb      = false
set path               = Z:\;Z:\SYSTEM;Z:\BIN;Z:\DOS;Z:\4DOS;Z:\DEBUG;Z:\TEXTUTIL
set prompt             = $P$G

[autoexec]
ECHO OFF

MODE CON COLS=80 LINES=43
KEYB BE 437 > nul

IMGMOUNT A "~/retroprogramming/disks/a.img" -t floppy > nul
IMGMOUNT B "~/retroprogramming/disks/b.img" -t floppy > nul
MOUNT    C "~/retroprogramming/disks/c"               > nul

SET B=C:\BINARIES\BORLAND
SET C=C:\BINARIES\CA
SET M=C:\BINARIES\MICROSFT
SET N=C:\BINARIES\NORTON
SET U=C:\BINARIES\UTILITY
SET V=C:\BINARIES\VOLKSWRT
SET W=C:\BINARIES\WORDPERF

SET PATH=%PATH%;%B%\TASM;%B%\TBASIC;%B%\TC;%B%\TDEBUG\;%B%\TPASCAL;%B%\TPROLOG;%M%\MASM\BIN;%M%\MSC\BIN;%M%\MSCOBOL\BIN;%M%\MSFORTRN\BIN;%M%\MSFORTRN\BINB;%M%\MSPASCAL\BIN;%M%\MSQBASIC;%C%\CLIPPER\BIN;%C%\CATOOLS\BIN;%N%\NGUIDE;%U%;%V%;%W%

SET ASMEX=%M%\MASM\SAMPLES
SET COBDIR=%M%\MSCOBOL\BIN
SET HELPFILES=%M%\MASM\HELP\*.HLP;%M%\MSC\HELP\*.HLP;%M%\MSCOBOL\HELP\*.HLP;%M%\MSFORTRN\HELP\*.HLP;
SET INCLUDE=%M%\MASM\INCLUDE;%M%\MSC\INCLUDE;%M%\MSCOBOL\SOURCE;%M%\MSFORTRN\INCLUDE;%M%\MSPASCAL\INCLUDE;%M%\MSQBASIC\INCLUDE;%C%\CLIPPER\INCLUDE;%C%\CATOOLS\INCLUDE
SET INIT=
SET LIB=%M%\MSC\LIB;%M%\MSCOBOL\LIB;%M%\MSFORTRN\LIB;%M%\MSPASCAL\LIB;%M%\MSQBASIC\LIB;%C%\CLIPPER\LIB;%C%\CATOOLS\LIB
SET OBJ=%C%\CLIPPER\OBJ;%C%\CATOOLS\OBJ
SET PLL=%C%\CLIPPER\PLL;%C%\CATOOLS\PLL
SET TMP=C:\TEMP
SET TEMP=C:\TEMP

SET B=
SET C=
SET M=
SET N=
SET U=
SET V=
SET W=

C:
